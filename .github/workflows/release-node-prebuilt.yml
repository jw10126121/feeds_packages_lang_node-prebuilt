name: release-node-prebuilt

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 预编译来源类型，openwrt、lean 或 immortalwrt
        required: true
        default: openwrt
        type: choice
        options:
          - openwrt
          - lean
          - immortalwrt
      release_tag:
        description: 需要上传到的 GitHub Release tag
        required: true
        type: string
      upload_to_release:
        description: 是否把构建产物上传到 release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    env:
      FLAVOR: ${{ inputs.flavor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build matrix from SDK manifest
        id: matrix
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          manifest_path = "ci/sdk-manifest.json"
          flavor = os.environ["FLAVOR"]

          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = json.load(f)

          if flavor not in manifest:
              raise SystemExit(f"Flavor '{flavor}' not found in {manifest_path}")

          entries = manifest[flavor]
          if not isinstance(entries, list):
              raise SystemExit(
                  f"Flavor '{flavor}' in {manifest_path} must be a JSON array"
              )

          if not entries:
              raise SystemExit(
                  f"No SDK targets configured for flavor '{flavor}' in {manifest_path}"
              )

          normalized = []
          missing = []
          for entry in entries:
              if not isinstance(entry, dict):
                  raise SystemExit(
                      f"Each entry under flavor '{flavor}' must be an object"
                  )
              entry_id = entry.get("id", "").strip()
              target = entry.get("target", "").strip()
              sdk_url = entry.get("sdk_url", "").strip()

              if not entry_id or not target or not sdk_url:
                  missing.append(entry)
                  continue

              normalized.append({
                  "id": entry_id,
                  "target": target,
                  "sdk_url": sdk_url,
              })

          if missing:
              raise SystemExit(
                  f"Please fill id/target/sdk_url for every '{flavor}' entry in {manifest_path}"
              )

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as f:
              f.write("matrix=%s\n" % json.dumps({"include": normalized}, separators=(",", ":")))
              f.write("count=%d\n" % len(normalized))
          PY

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      FLAVOR: ${{ inputs.flavor }}
      SDK_URL: ${{ matrix.sdk_url }}
      TARGET_ID: ${{ matrix.id }}
      TARGET_PATH: ${{ matrix.target }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev file wget curl zstd

      - name: Download and extract SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          sdk_archive="$RUNNER_TEMP/sdk.tar"

          case "$SDK_URL" in
            *.tar.zst)
              sdk_archive="$RUNNER_TEMP/sdk.tar.zst"
              curl -fL "$SDK_URL" -o "$sdk_archive"
              tar --zstd -xf "$sdk_archive" -C "$RUNNER_TEMP/sdk" --strip-components=1
              ;;
            *.tar.xz)
              sdk_archive="$RUNNER_TEMP/sdk.tar.xz"
              curl -fL "$SDK_URL" -o "$sdk_archive"
              tar -xJf "$sdk_archive" -C "$RUNNER_TEMP/sdk" --strip-components=1
              ;;
            *.tar.gz|*.tgz)
              sdk_archive="$RUNNER_TEMP/sdk.tar.gz"
              curl -fL "$SDK_URL" -o "$sdk_archive"
              tar -xzf "$sdk_archive" -C "$RUNNER_TEMP/sdk" --strip-components=1
              ;;
            *)
              echo "Unsupported SDK archive format: $SDK_URL" >&2
              exit 1
              ;;
          esac

      - name: Inject package into SDK
        working-directory: ${{ runner.temp }}/sdk
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package/lang/node
          rsync -a --delete \
            --exclude .git \
            --exclude dist \
            "$GITHUB_WORKSPACE"/ package/lang/node/

      - name: Build node and node-npm
        working-directory: ${{ runner.temp }}/sdk
        shell: bash
        run: |
          set -euxo pipefail
          make defconfig
          make package/lang/node/clean
          make package/lang/node/compile -j"$(nproc)" V=s

          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin/packages -type f \( -name "node_*.ipk" -o -name "node_*.apk" -o -name "node-npm_*.ipk" -o -name "node-npm_*.apk" \) -print > "$RUNNER_TEMP/package-list.txt"

          node_pkg="$(grep '/node_[^/]*\.\(ipk\|apk\)$' "$RUNNER_TEMP/package-list.txt" | head -n1)"
          npm_pkg="$(grep '/node-npm_[^/]*\.\(ipk\|apk\)$' "$RUNNER_TEMP/package-list.txt" | head -n1)"

          test -n "$node_pkg"
          test -n "$npm_pkg"

          pkg_ext="${node_pkg##*.}"
          node_name="$(basename "$node_pkg")"
          npm_name="$(basename "$npm_pkg")"
          node_version_arch="${node_name%.*}"
          npm_version_arch="${npm_name%.*}"
          actual_arch="$(echo "$node_name" | sed -E 's/^node_[^_]+_(.+)\.(ipk|apk)$/\1/')"
          npm_arch="$(echo "$npm_name" | sed -E 's/^node-npm_[^_]+_(.+)\.(ipk|apk)$/\1/')"

          test "$actual_arch" = "$npm_arch"

          cp "$node_pkg" "$GITHUB_WORKSPACE/dist/${node_version_arch}_${FLAVOR}.${pkg_ext}"
          cp "$npm_pkg" "$GITHUB_WORKSPACE/dist/${npm_version_arch}_${FLAVOR}.${pkg_ext}"

          cd "$GITHUB_WORKSPACE/dist"
          sha256sum * > SHA256SUMS
          {
            echo "flavor=$FLAVOR"
            echo "sdk_url=$SDK_URL"
            echo "target_id=$TARGET_ID"
            echo "target_path=$TARGET_PATH"
            echo "arch_packages=$actual_arch"
            echo "package_format=$pkg_ext"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD_INFO.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-prebuilt-${{ inputs.flavor }}-${{ matrix.id }}
          path: dist/*

      - name: Upload to GitHub Release
        if: ${{ inputs.upload_to_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist/*.apk
            dist/*.ipk
            dist/SHA256SUMS
            dist/BUILD_INFO.txt
